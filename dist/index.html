<!DOCTYPE html>
<html>
    <head>
        <title>Chat</title>
        <style>:root {
    --header-background: #101010;
    --server-list-background: #202020;
    --channel-list-background: #303030;
    --chat-background: #404040;
    --profile-background: #505050;
    --chat-input-background: #505050;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: black;
    overflow: hidden;
}

.header {
    background: var(--header-background);
    flex: 0 0 15px;
}

.main {
    display: flex;
    flex-direction: column;
}

.lists  {
    display: flex;
    flex-direction: row;
    flex: 1;
    min-height: 0;
}

.server-list {
    background: var(--server-list-background);
    flex: 0 0 64px;
}

.channel-list {
    background: var(--channel-list-background);
    flex: 0 0 192px;
}

.chat-list {
    background: var(--chat-background);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
}

.footer {
    position: fixed;
    bottom: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    flex-direction: row;
    height: 64px;
    gap:16px;
}

.profile {
    background: var(--profile-background);
    border-radius: 8px;
    flex: 0 0 240px;
}

.chat-input {
    background: var(--chat-input-background);
    border-radius: 8px;
    flex: 1;
}
</style>
    </head>
    <body>
        <div class="main">
            <div class="header"></div>
            <div class="lists">
                <div class="server-list"></div>
                <div class="channel-list"></div>
                <div class="chat-list" id="chat-list"></div>
            </div>
        </div>
        <div class="footer">
            <div class="profile"></div>
            <div class="chat-input"></div>
        </div>
        <script>"use strict";
(() => {
  // src/main.ts
  var chatList = document.getElementById("chat-list");
  function sendMessage(text) {
    chatList.innerHTML += text += "<br>";
  }
  function main() {
    for (let i = 0; i < 50; ++i) sendMessage("hello world");
  }
  main();
})();
</script>
    </body>
</html>
